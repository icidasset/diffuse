<style>
  @import "./vendor/@awesome.me/webawesome/styles/webawesome.css" layer(wa);

  @layer base, diffuse, wa;

  main {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    opacity: 0;
    pointer-events: none;
    transition: opacity 750ms;

    &.has-loaded {
      opacity: 1;
      pointer-events: auto;
    }
  }

  wa-card {
    width: min(400px, calc(100vw - 2rem));
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-body {
    display: flex;
    flex-direction: column;
    gap: var(--wa-space-m);
  }

  .button-row {
    display: flex;
    gap: var(--wa-space-s);
    flex-wrap: wrap;
  }

  .dialog-body {
    display: flex;
    flex-direction: column;
    gap: var(--wa-space-m);
  }

  .dialog-footer {
    display: flex;
    gap: var(--wa-space-s);
  }

  .buckets-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: var(--wa-space-s);
  }

  .bucket-item {
    display: flex;
    align-items: center;
    gap: var(--wa-space-s);
  }

  .bucket-info {
    display: flex;
    flex-direction: column;
    gap: var(--wa-space-2xs);
    flex: 1;
    min-width: 0;
  }

  .bucket-name {
    font-weight: var(--wa-font-weight-semibold);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bucket-host {
    font-size: var(--wa-font-size-xs);
    color: var(--wa-color-text-quiet);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bucket-tags {
    display: flex;
    gap: var(--wa-space-2xs);
    flex-shrink: 0;
  }

  [hidden] {
    display: none !important;
  }

  p {
    margin: 0;
  }
</style>

<main class="wa-theme-default">
  <wa-card>
    <div slot="header" class="card-header">
      <strong>S3</strong>
    </div>

    <div class="card-body">
      <p>Connect to an S3-compatible storage to use it as audio input or user-data storage.</p>

      <p class="wa-caption-xs">
        A custom syncing strategy is used for the user-data storage, tracking what was added and
        removed so conflicts can be resolved.
      </p>

      <div class="button-row">
        <wa-button id="add-input-btn" variant="brand" appearance="filled">
          <wa-icon slot="start" library="phosphor/bold" name="music-notes"></wa-icon>
          Add audio input
        </wa-button>
        <wa-button id="add-output-btn" variant="neutral" appearance="outlined">
          <wa-icon slot="start" library="phosphor/bold" name="person"></wa-icon>
          Use as userdata storage
        </wa-button>
      </div>

      <wa-divider id="buckets-divider" hidden></wa-divider>

      <ul id="buckets-list" class="buckets-list" hidden>
        <!-- Rendered by JS -->
      </ul>
    </div>
  </wa-card>

  <wa-dialog id="bucket-dialog" label="Add S3 Bucket">
    <div class="dialog-body">
      <wa-input id="host-input" label="Host" placeholder="s3.amazonaws.com"></wa-input>
      <wa-input id="bucket-name-input" label="Bucket name" placeholder="my-bucket"></wa-input>
      <wa-input id="region-input" label="Region" placeholder="us-east-1"></wa-input>
      <wa-input id="access-key-input" label="Access key"></wa-input>
      <wa-input id="secret-key-input" label="Secret key" type="password"></wa-input>
      <wa-input id="path-input" label="Path" placeholder="/"></wa-input>
    </div>
    <div slot="footer" class="dialog-footer">
      <wa-button id="confirm-btn" variant="brand" appearance="filled">Add</wa-button>
      <wa-button id="cancel-btn" variant="neutral" appearance="outlined">Cancel</wa-button>
    </div>
  </wa-dialog>
</main>

<script type="module" src="facets/connect/s3/index.inline.js"></script>

<script type="module">
  await customElements.whenDefined("wa-button");
  document.querySelector("main")?.classList.add("has-loaded");
</script>
