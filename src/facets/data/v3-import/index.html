<main>
  <div class="panel">
    <p>
      Import data from the previous version of Diffuse (v3). Upload the snapshot JSON file you
      exported.
    </p>
    <hr />
    <div class="row">
      <label class="with-icon" for="file">
        <i class="ph-bold ph-upload"></i>
        <input id="file" type="file" accept=".json,application/json" />
      </label>
    </div>
    <hr />
    <div class="row">
      <button id="import-favourites" disabled>
        <span class="with-icon"><i class="ph-fill ph-star"></i> Import favourites</span>
      </button>
    </div>
    <div class="row">
      <button id="import-playlist-items" disabled>
        <span class="with-icon"><i class="ph-bold ph-playlist"></i> Import playlist items</span>
      </button>
    </div>
    <div id="status" class="status" hidden></div>
  </div>
</main>

<style>
  @import "./styles/base.css";
  @import "./styles/wireframe/ui.css";
  @import "./vendor/@phosphor-icons/web/bold/style.css";
  @import "./vendor/@phosphor-icons/web/fill/style.css";

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100dvh;
  }

  main {
    opacity: 0;
    padding: var(--space-md);
    pointer-events: none;
    transition: opacity 750ms;

    &.has-loaded {
      opacity: 1;
      pointer-events: auto;
    }
  }

  p {
    line-height: var(--leading-relaxed);
    max-width: 42ch;
  }

  label {
    flex: 1;
  }

  input[type="file"] {
    flex: 1;
  }

  .status {
    margin-top: var(--space-sm);
    font-size: var(--text-sm);
  }

  .status--success {
    color: var(--accent);

    @media (prefers-color-scheme: dark) {
      color: var(--accent-twist-4);
    }
  }

  .status--error {
    color: var(--accent-twist-5);

    @media (prefers-color-scheme: dark) {
      color: var(--accent-twist-3);
    }
  }
</style>

<script type="module" src="facets/data/v3-import/index.inline.js"></script>
