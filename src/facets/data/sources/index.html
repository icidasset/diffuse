<style>
  @import "./styles/base.css";
  @import "./styles/diffuse/facet.css";
  @import "./vendor/@phosphor-icons/web/fill/style.css";
  @import "/facet.css";
</style>

<main>
  <div class="facet__left">
    <div>
      <a href="./dashboard/" class="diffuse-logo-container">
        <svg viewBox="0 0 902 134" width="160">
          <title>Diffuse</title>
          <use
            xlink:href="images/diffuse-current.svg#diffuse"
            href="images/diffuse-current.svg#diffuse"
          ></use>
        </svg>
      </a>
    </div>
    <h1>Sources</h1>
    <p>
      An overview of all your audio inputs. Remember that these need to be processed into tracks
      before they become useful. This should happen automatically when you have that feature enabled
      (on by default), otherwise click the button below.
    </p>
    <p class="button-row" style="margin-top: var(--space-md)">
      <a href="./l/?path=facets/connect/index.tile" class="button button--accent">
        <i class="ph-fill ph-plugs"></i>
        Add a source
      </a>
      <button id="process-btn">
        <i id="process-icon" class="ph-fill ph-arrows-clockwise"></i>
        <span id="process-label">Process</span>
      </button>
    </p>
  </div>

  <div class="facet__right">
    <ul id="sources-list" class="sources-list" hidden></ul>
    <p id="sources-empty" class="caption">No sources configured yet.</p>
  </div>
</main>

<script type="module" src="/facet.js"></script>
