<main>
  <div id="command-menu" class="panel">
    <div id="breadcrumbs" aria-label="Navigation path" role="navigation"></div>
    <label for="search" id="search-wrapper">
      <input
        id="search"
        type="text"
        placeholder="Type a command…"
        autocomplete="off"
        spellcheck="false"
        role="combobox"
        aria-autocomplete="list"
        aria-controls="kmenu-listbox"
        aria-expanded="true"
      />
    </label>
    <ul id="kmenu-listbox" role="listbox" aria-label="Commands"></ul>
  </div>
</main>

<style>

  @import "./vendor/@phosphor-icons/web/bold/style.css";

  body {

    justify-content: center;

  }

    width: min(var(--container-lg), 90vw);
  }

  #command-menu {
    padding: 0;
    overflow: hidden;
  }

  #breadcrumbs {
    display: flex;

    gap: var(--space-sm);
    padding: var(--space-xs) var(--space-sm);
    font-size: var(--fs-xs);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: var(--tracking-wider);
    color: oklch(from var(--text-color) l c h / 0.5);
    border-bottom: 2px solid var(--form-color);
  }

  #breadcrumbs:empty {
    display: none;
  }

  .crumb-home {
    background: oklch(from var(--text-color) l c h / 0.075);
    border: none;
