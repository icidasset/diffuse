<style>
  @import "./styles/base.css";
  @import "./styles/diffuse/facet.css";
  @import "./vendor/@phosphor-icons/web/fill/style.css";
  @import "./vendor/@phosphor-icons/web/bold/style.css";
  @import "/facet.css";
</style>

<main>
  <div class="facet__left">
    <div>
      <a href="./dashboard/" class="diffuse-logo-container">
        <svg viewBox="0 0 902 134" width="160">
          <title>Diffuse</title>
          <use
            xlink:href="images/diffuse-current.svg#diffuse"
            href="images/diffuse-current.svg#diffuse"
          ></use>
        </svg>
      </a>
    </div>
    <h1>Queue</h1>
    <p>
      Manage your playback queue. Reorder upcoming tracks or clear the queue. Tracks marked
      <strong>M</strong> were manually added and survive an auto-clear.
    </p>
    <p class="button-row" style="margin-top: var(--space-md)">
      <button id="clear-all-btn">
        <i class="ph-fill ph-trash"></i>
        Clear all
      </button>
      <button id="clear-auto-btn">
        <i class="ph-fill ph-robot"></i>
        Clear auto
      </button>
    </p>
  </div>

  <div class="facet__right">
    <div id="now-section" class="queue-section" hidden>
      <span class="queue-section__heading">Now Playing</span>
      <ul id="now-list" class="queue-list"></ul>
    </div>
    <div id="future-section" class="queue-section" hidden>
      <span class="queue-section__heading">Up Next</span>
      <ul id="future-list" class="queue-list"></ul>
    </div>
    <div id="past-section" class="queue-section" hidden>
      <span class="queue-section__heading">History</span>
      <ul id="past-list" class="queue-list"></ul>
    </div>
    <p id="queue-empty" class="caption">The queue is empty.</p>
  </div>
</main>

<script type="module" src="/facet.js"></script>
